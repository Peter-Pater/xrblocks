<!doctype html>
<html lang="en">
  <head>
    <title>3D Object Boxes (Addon)</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <link type="text/css" rel="stylesheet" href="../../samples/main.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
          "three/": "https://cdn.jsdelivr.net/npm/three@0.184.0/",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/",
          "xrblocks": "../../build/xrblocks.js",
          "xrblocks/addons/": "../../build/addons/",
          "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.34/vision_bundle.mjs",
          "@google/genai": "https://cdn.jsdelivr.net/npm/@google/genai/+esm",
          "@huggingface/transformers": "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0",
          "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.10/build/index.module.js"
        }
      }
    </script>
    <style>
      .panel {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        display: flex;
        gap: 10px;
        align-items: center;
        background: rgba(20, 20, 20, 0.85);
        padding: 14px 18px;
        border-radius: 12px;
        font-family: system-ui, sans-serif;
        color: #eee;
      }
      .panel button {
        padding: 9px 14px;
        border-radius: 8px;
        border: 1px solid #444;
        background: #2a2a2a;
        color: white;
        cursor: pointer;
        font-size: 14px;
      }
      .panel button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .panel .status {
        font-size: 12px;
        color: #aaa;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <button id="detectBtn">Detect</button>
      <button id="clearBtn">Clear</button>
      <span class="status" id="status">Ready. In XR, pinch to detect.</span>
    </div>

    <script type="module">
      import * as xb from 'xrblocks';
      import {Object3DDetector} from 'xrblocks/addons/objects3d/index.js';

      const statusEl = document.getElementById('status');
      const detectBtn = document.getElementById('detectBtn');
      const clearBtn = document.getElementById('clearBtn');

      function setStatus(text) {
        statusEl.textContent = text;
        console.log('[objects3d-addon]', text);
      }

      // The whole demo: construct the detector, add it, call detect().
      const detector = new Object3DDetector({
        detectBackend: 'gemini',
        maskBackend: 'slimsam',
        showDebugBoxes: true,
      });

      let inFlight = false;
      async function detect() {
        if (inFlight) return;
        inFlight = true;
        detectBtn.disabled = true;
        setStatus('detecting…');
        try {
          const objects = await detector.detect();
          setStatus(`${objects.length} objects.`);
        } catch (e) {
          console.error(e);
          setStatus(`failed: ${e?.message ?? e}`);
        } finally {
          inFlight = false;
          detectBtn.disabled = false;
        }
      }

      detectBtn.addEventListener('click', detect);
      clearBtn.addEventListener('click', () => {
        detector.clearDetections();
        setStatus('cleared.');
      });

      const options = new xb.Options();
      options.enableAI();
      options.enableCamera();
      options.enableDepth();
      options.depth.depthTexture.enabled = false;
      options.depth.matchDepthView = false;
      options.enableObjectDetection();
      options.world.objects.showDebugVisualizations = false;
      options.reticles.enabled = true;
      options.setAppTitle('3D Object Boxes (Addon)');

      xb.add(detector);
      await xb.init(options);

      // In immersive XR the DOM panel is invisible, so pinch / trigger runs
      // a detection instead.
      xb.core.renderer.xr.addEventListener('sessionstart', () => {
        xb.core.renderer.xr
          .getSession()
          ?.addEventListener('select', () => detect());
      });
    </script>
  </body>
</html>
